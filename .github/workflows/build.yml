name: Verify plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check Windows x64
        shell: pwsh
        run: |
          cargo test --release --locked --all-targets --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --release --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Build Windows package
        shell: pwsh
        run: ./build/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: interstitial-graphs-windows-x64
          path: artifacts/*.zip
          if-no-files-found: error
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        run: |
          cargo test --release --locked --all-targets
          cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package Linux action
        env:
          TARGET: ${{ matrix.target }}
        run: |
          id="$(jq -r .PluginUUID manifest.json).sdPlugin"
          binary="$(jq -r --arg target "$TARGET" '.CodePaths[$target]' manifest.json)"
          mkdir -p "$id"
          cp "target/$TARGET/release/oa-graphs" "$id/$binary"
          cp -r img LICENSE README.md pi.html inspector.css strip.json "$id/"
          cp fonts/LICENSE-DejaVu.txt "$id/"
          jq --arg target "$TARGET" --arg binary "$binary" '.OS |= map(select(.Platform=="linux")) | .CodePaths={($target):$binary} | .CodePathLin=$binary | del(.CodePathWin)' manifest.json > "$id/manifest.json"
          zip -qr "interstitial-graphs-$TARGET.zip" "$id"
      - uses: actions/upload-artifact@v4
        with:
          name: interstitial-graphs-${{ matrix.target }}
          path: interstitial-graphs-*.zip
          if-no-files-found: error
